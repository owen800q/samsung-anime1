name: Prepare pairing feature branch
on:
  push:
    branches: [feat/tv-qr-device-pairing]
    paths: [.github/workflows/prepare-pairing.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/tv-qr-device-pairing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p pairing-results
      - run: npm install --no-save --package-lock=false qrcode-terminal@0.12.0
      - run: node scripts/prepare-pairing.mjs
      - run: npm run build
      - name: Commit integrated source and reproducible assets to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src dist scripts/build.mjs scripts/check-ux.mjs README.md
          git commit -m 'feat: integrate TV QR pairing and build generated assets'
          git push origin HEAD:feat/tv-qr-device-pairing
      - run: npm test 2>&1 | tee pairing-results/unit.log
      - run: npm install --no-save --package-lock=false playwright@1.57.0 jsqr@1.4.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-pairing.mjs 2>&1 | tee pairing-results/browser.log
        env:
          PAIRING_ARTIFACT_DIR: pairing-results/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-integrated-build
          retention-days: 3
          path: |
            pairing-results/
            src/
            dist/
            scripts/
            tests/
            docs/
            README.md
            package.json
